workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Grant execute permission to gradlew
        script: |
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Grant execute permission to gradlew
        script: |
          chmod +x gradlew
      - name: Build iOS framework
        script: |
          ./gradlew :app:linkDebugFrameworkIosSimulatorArm64
    artifacts:
      - app/build/bin/iosSimulatorArm64/debugFramework/*.framework
